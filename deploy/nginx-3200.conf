# Nginx site for the landing page on port 3200.
# Copy to /etc/nginx/sites-available/expdevteamweb and symlink into sites-enabled.
server {
    listen 3200;
    listen [::]:3200;
    server_name _;

    root /srv/expdevteamweb/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
